[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantcritic"
version = "0.1.0"
description = "Most crypto backtests lie. QuantCritic finds out how. Realistic crypto-perpetuals backtester, robustness audit suite, risk manager, and AI strategy critic."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Surani Asim" }
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "plotly>=5.18.0",
    "jinja2>=3.1.0",
    "anthropic>=2.13.0",
    "pydantic>=2.0.0",
    "streamlit>=1.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
quantcritic = "quantcritic.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quantcritic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
